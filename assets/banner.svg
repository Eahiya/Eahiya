<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Eahiya A - AI and ML Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#140a26"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.6" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff3d81"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff3d81"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowL" cx="0.15" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#ff3d81" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff3d81" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glowL)"/>
    <rect width="1200" height="340" fill="url(#glowR)"/>

    <!-- speed lines -->
    <g stroke="#00e5ff" stroke-linecap="round" opacity="0.5">
      <line x1="-200" y1="60" x2="-60" y2="60" stroke-width="2">
        <animate attributeName="x1" from="-200" to="1300" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="x2" from="-60" to="1440" dur="3.2s" repeatCount="indefinite"/>
      </line>
      <line x1="-400" y1="290" x2="-230" y2="290" stroke-width="2" stroke="#ff3d81">
        <animate attributeName="x1" from="-400" to="1300" dur="4.1s" repeatCount="indefinite"/>
        <animate attributeName="x2" from="-230" to="1470" dur="4.1s" repeatCount="indefinite"/>
      </line>
      <line x1="-100" y1="175" x2="30" y2="175" stroke-width="1.5" stroke="#7c5cff">
        <animate attributeName="x1" from="-100" to="1300" dur="5.3s" repeatCount="indefinite"/>
        <animate attributeName="x2" from="30" to="1430" dur="5.3s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- circuit (stylised F1 track) -->
    <g transform="translate(660 28)">
      <path id="circuit" d="M60 200 C 40 120, 90 70, 170 75 C 240 80, 250 130, 320 120 C 400 108, 430 40, 480 70 C 530 100, 480 170, 430 200 C 380 232, 330 205, 280 232 C 220 266, 100 270, 60 200 Z"
            fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="16" stroke-linejoin="round"/>
      <path d="M60 200 C 40 120, 90 70, 170 75 C 240 80, 250 130, 320 120 C 400 108, 430 40, 480 70 C 530 100, 480 170, 430 200 C 380 232, 330 205, 280 232 C 220 266, 100 270, 60 200 Z"
            fill="none" stroke="url(#track)" stroke-width="3" stroke-linejoin="round" stroke-dasharray="14 10">
        <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <!-- start/finish -->
      <rect x="54" y="188" width="14" height="24" fill="#fff" opacity="0.9"/>
      <rect x="54" y="188" width="7" height="8" fill="#000"/><rect x="61" y="196" width="7" height="8" fill="#000"/><rect x="54" y="204" width="7" height="8" fill="#000"/>

      <!-- car glow + dot -->
      <circle r="11" fill="#ff3d81" opacity="0.55" filter="url(#blur)">
        <animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#circuit"/></animateMotion>
      </circle>
      <circle r="5" fill="#ffffff">
        <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#circuit"/></animateMotion>
      </circle>
      <circle r="9" fill="#00e5ff" opacity="0.5" filter="url(#blur)">
        <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#circuit"/></animateMotion>
      </circle>
      <circle r="4" fill="#00e5ff">
        <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#circuit"/></animateMotion>
      </circle>
    </g>

    <!-- sector indicators -->
    <g transform="translate(990 36)" font-family="'Courier New', monospace" font-size="12" fill="#8aa0b8" letter-spacing="2">
      <text x="0" y="0">SECTORS</text>
      <rect x="0" y="10" width="46" height="6" rx="3" fill="#a855f7"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="54" y="10" width="46" height="6" rx="3" fill="#22c55e"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></rect>
      <rect x="108" y="10" width="46" height="6" rx="3" fill="#facc15"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></rect>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="64" y="76" font-family="'Courier New', monospace" font-size="15" fill="#00e5ff" letter-spacing="6">
        &gt; HELLO, WORLD. I'M
        <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
      </text>
      <text x="60" y="168" font-size="104" font-weight="900" fill="url(#name)" letter-spacing="-2">
        EAHIYA A
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="64" y="212" font-size="22" font-weight="600" fill="#e6edf7" letter-spacing="3">
        AI &amp; ML ENGINEER
        <animate attributeName="opacity" values="0;1" begin="0.5s" dur="1s" fill="freeze"/>
      </text>
      <text x="64" y="246" font-family="'Courier New', monospace" font-size="15" fill="#8aa0b8" letter-spacing="1.5">
        Predictive Analytics  |  Network Simulation  |  NLP  |  Full-Stack ML
        <animate attributeName="opacity" values="0;1" begin="0.9s" dur="1s" fill="freeze"/>
      </text>
      <g transform="translate(64 272)">
        <rect width="238" height="34" rx="17" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.7"/>
        <circle cx="20" cy="17" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
        <text x="34" y="22" font-family="'Courier New', monospace" font-size="13.5" fill="#86efac" letter-spacing="1">OPEN TO INTERNSHIPS</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
